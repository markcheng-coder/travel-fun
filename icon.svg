<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 旅遊趣 App 圖示：微笑的小行李箱 -->
  <rect width="512" height="512" rx="120" fill="#ffe9d6"/>
  <circle cx="420" cy="96" r="70" fill="#fff6cf"/>

  <!-- 背景小星星、小點 -->
  <g fill="#f6c85f">
    <path d="M92 118 l8 18 18 8 -18 8 -8 18 -8 -18 -18 -8 18 -8z"/>
    <path d="M426 300 l6 13 13 6 -13 6 -6 13 -6 -13 -13 -6 13 -6z"/>
  </g>
  <g fill="#f4a6a6"><circle cx="70" cy="330" r="9"/><circle cx="452" cy="420" r="8"/></g>

  <g transform="rotate(-6 256 290)">
    <!-- 提把 -->
    <rect x="200" y="112" width="112" height="70" rx="32" fill="none" stroke="#b9634d" stroke-width="22"/>
    <!-- 箱體 -->
    <rect x="112" y="160" width="288" height="236" rx="70" fill="#f08a6c"/>
    <rect x="112" y="160" width="288" height="236" rx="70" fill="none" stroke="#d9694d" stroke-width="8"/>
    <!-- 貼紙 -->
    <rect x="300" y="190" width="70" height="44" rx="14" fill="#c9ecd6" transform="rotate(12 335 212)"/>
    <circle cx="160" cy="352" r="18" fill="#c7b3e6"/>
    <!-- 臉 -->
    <circle cx="208" cy="268" r="15" fill="#4a3226"/>
    <circle cx="304" cy="268" r="15" fill="#4a3226"/>
    <circle cx="213" cy="262" r="5" fill="#fff"/>
    <circle cx="309" cy="262" r="5" fill="#fff"/>
    <path d="M232 300 q24 24 48 0" fill="none" stroke="#4a3226" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="176" cy="302" rx="22" ry="13" fill="#ffb3b8" opacity=".9"/>
    <ellipse cx="336" cy="302" rx="22" ry="13" fill="#ffb3b8" opacity=".9"/>
    <!-- 頭上小花 -->
    <g transform="translate(150 168)">
      <g fill="#fff">
        <circle cx="0" cy="-22" r="18"/><circle cx="21" cy="-7" r="18"/><circle cx="13" cy="18" r="18"/><circle cx="-13" cy="18" r="18"/><circle cx="-21" cy="-7" r="18"/>
      </g>
      <circle r="12" fill="#f6c85f"/>
    </g>
    <!-- 輪子 -->
    <g fill="#4a3226"><circle cx="180" cy="414" r="20"/><circle cx="332" cy="414" r="20"/></g>
    <g fill="#ffe9d6"><circle cx="180" cy="414" r="7"/><circle cx="332" cy="414" r="7"/></g>
  </g>
</svg>
